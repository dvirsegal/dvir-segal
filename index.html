    <script>
      (function () {
        var body = document.body;
        var main = document.querySelector('main');
        // [background, text] pairs; clicking the page cycles through the list for the current theme
        var modes = {
          daylight: [['#282c34', '#fff'], ['#1565c0', '#ffeb3b'], ['#1abc9c', '#fff'], ['#e74c3c', '#fff'], ['#9b59b6', '#fff'], ['#e67e22', '#fff'], ['#3498db', '#fff']],
          nightlight: [['#fafafa', '#000'], ['#ffcdd2', '#000'], ['#e1bee7', '#000'], ['#c8e6c9', '#000'], ['#b3e5fc', '#000'], ['#fff9c4', '#000']]
        };
        var theme = 'daylight';
        var index = 0;

        function paint() {
          var mode = modes[theme][index];
          main.style.setProperty('--bg', mode[0]);
          main.style.setProperty('--fg', mode[1]);
        }

        document.querySelector('.change-mode').addEventListener('click', function () {
          body.classList.remove(theme);
          theme = theme === 'daylight' ? 'nightlight' : 'daylight';
          body.classList.add(theme);
          index = 0;
          paint();
        });

        main.addEventListener('click', function (e) {
          if (e.target.closest('a')) return;
          index = (index + 1) % modes[theme].length;
          paint();
        });

        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        var typed = document.getElementById('typed');
        var cursor = document.querySelector('.cursor');
        var text = typed.textContent;
        var i = 0;
        typed.textContent = '';
        cursor.classList.remove('done');
        (function type() {
          typed.textContent = text.slice(0, ++i);
          if (i < text.length) {
            setTimeout(type, 45 + Math.random() * 50);
          } else {
            setTimeout(function () { cursor.classList.add('done'); }, 1000);
          }
        })();
      })();
    </script>
